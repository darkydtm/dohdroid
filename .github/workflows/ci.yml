name: CI

env:
  ANDROID_NDK_VERSION: 26.3.11579264

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Rust ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [fmt, test, clippy]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        if: matrix.check != 'fmt'
        with:
          workspaces: daemon
      - if: matrix.check == 'fmt'
        run: cargo fmt --manifest-path daemon/Cargo.toml --check
      - if: matrix.check == 'test'
        run: cargo test --manifest-path daemon/Cargo.toml
      - if: matrix.check == 'clippy'
        run: cargo clippy --manifest-path daemon/Cargo.toml --all-targets --all-features -- -D warnings

  scripts:
    name: Script checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n module/service.sh module/boot-completed.sh module/uninstall.sh module/action.sh module/customize.sh package.sh module/scripts/*.sh scripts/*.sh
      - run: node tests/webui-permission.test.js
      - run: node tests/webui-theme.test.js
      - run: node tests/webui-restart.test.js
      - run: node tests/build-info.test.js
      - run: sh tests/install-permissions.test.sh
      - run: sh tests/private-dns.test.sh
      - run: sh tests/firewall.test.sh
      - run: sh tests/bootstrap.test.sh
      - run: sh tests/boot-recovery.test.sh
      - run: sh tests/description.test.sh
      - run: sh tests/killswitch.test.sh
      - run: sh tests/default-config.test.sh
      - run: sh tests/service-system-dns.test.sh
      - run: bash -n module/scripts/bootstrap.sh
      - run: sh tests/process.test.sh
      - run: sh tests/state.test.sh
      - run: sh tests/tun-firewall.test.sh

  build:
    name: Build ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
            sing_arch: arm64
            # Verify the downloaded sing-box archive against this SHA-256 digest.
            sing_sha: fb3a6c5197f4044f82c8fd75e01ce14c28b6abdd4c3df84bb987d41a962a320f
            linker: aarch64-linux-android24-clang
            cc: aarch64-linux-android24-clang
            # Select the Cargo linker environment variable suffix.
            ar: llvm-ar
            # Select Cargo's target-specific linker environment variable suffix.
            cargo_target: AARCH64_LINUX_ANDROID
          - abi: armeabi-v7a
            target: armv7-linux-androideabi
            sing_arch: arm
            # Verify the downloaded sing-box archive against this SHA-256 digest.
            sing_sha: a89f48c4f2691bf37476308212175ba7b7315db5ca03c0bf9b20d15f26bc70e9
            linker: armv7a-linux-androideabi24-clang
            cc: armv7a-linux-androideabi24-clang
            # Select the Cargo linker environment variable suffix.
            ar: llvm-ar
            # Select Cargo's target-specific linker environment variable suffix.
            cargo_target: ARMV7_LINUX_ANDROIDEABI
          - abi: x86_64
            target: x86_64-linux-android
            sing_arch: amd64
            # Verify the downloaded sing-box archive against this SHA-256 digest.
            sing_sha: e72a8eead1ace9ce84a4ed07dfbf364e87562b736463fc00967b845cf9b3b8ac
            linker: x86_64-linux-android24-clang
            cc: x86_64-linux-android24-clang
            # Select the Cargo linker environment variable suffix.
            ar: llvm-ar
            # Select Cargo's target-specific linker environment variable suffix.
            cargo_target: X86_64_LINUX_ANDROID
          - abi: x86
            target: i686-linux-android
            sing_arch: '386'
            # Verify the downloaded sing-box archive against this SHA-256 digest.
            sing_sha: 6b715f5ee3d1ad1738da99e7c207db807a06560f623a2a44105dd3c34339fd93
            linker: i686-linux-android24-clang
            cc: i686-linux-android24-clang
            # Select the Cargo linker environment variable suffix.
            ar: llvm-ar
            # Select Cargo's target-specific linker environment variable suffix.
            cargo_target: I686_LINUX_ANDROID
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemon
          key: android-${{ matrix.target }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "ndk;${ANDROID_NDK_VERSION}"
      - name: Build Android module
        env:
          TARGET: ${{ matrix.target }}
          LINKER: ${{ matrix.linker }}
          CC_NAME: ${{ matrix.cc }}
          AR_NAME: ${{ matrix.ar }}
          BUILD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          . scripts/package-common.sh
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          export CARGO_TARGET_${{ matrix.cargo_target }}_LINKER="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/$LINKER"
          target_env="${TARGET//-/_}"
          export "CC_${target_env}=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/$CC_NAME"
          export "CXX_${target_env}=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/$CC_NAME++"
          export "AR_${target_env}=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/$AR_NAME"
          cargo build --manifest-path daemon/Cargo.toml --release --target "$TARGET"
          curl -fsSL --retry 3 -o sing-box.tar.gz "https://github.com/SagerNet/sing-box/releases/download/v1.14.4/sing-box-1.14.4-android-${{ matrix.sing_arch }}.tar.gz"
          echo '${{ matrix.sing_sha }}  sing-box.tar.gz' | sha256sum -c -
          mkdir sing-box-dist
          tar -xzf sing-box.tar.gz -C sing-box-dist --strip-components=1
          OUT="module/package-${{ matrix.abi }}"
          trap 'rm -rf "$OUT"' EXIT
          stage_module "$PWD" "${{ matrix.abi }}" "$OUT" sing-box-dist/sing-box
          (cd "$OUT" && zip -qr "$GITHUB_WORKSPACE/dohd-${{ matrix.abi }}.zip" .)
          sha256sum "dohd-${{ matrix.abi }}.zip" > "dohd-${{ matrix.abi }}.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: dohd-module-${{ matrix.abi }}
          path: |
            dohd-${{ matrix.abi }}.zip
            dohd-${{ matrix.abi }}.zip.sha256
          if-no-files-found: error

  verify-modules:
    name: Verify ${{ matrix.abi }} module
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64, x86]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dohd-module-${{ matrix.abi }}
      - name: Verify module contents
        run: |
          set -euxo pipefail
          . scripts/package-common.sh
          archive="dohd-${{ matrix.abi }}.zip"
          sha256sum -c "$archive.sha256"
          unzip -Z1 "$archive" > archive-files.txt
          expected_files=$(printf '%s\n' module.prop service.sh uninstall.sh action.sh scripts/firewall.sh scripts/webui.sh customize.sh boot-completed.sh webroot/index.html webroot/styles.css webroot/js/api.js webroot/js/state.js webroot/js/app.js webroot/build-info.js "system/bin/${{ matrix.abi }}/dohd" "system/bin/${{ matrix.abi }}/sing-box" config/config.toml.example config/tun.json scripts/tun-firewall.sh)
          while IFS= read -r expected; do
            grep -Fxq "$expected" archive-files.txt || { echo "missing archive file: $expected" >&2; exit 1; }
          done <<EOF
          $expected_files
          EOF
          while IFS= read -r abi; do
            [ "$abi" = "${{ matrix.abi }}" ] && continue
            if grep -Fxq "system/bin/$abi/dohd" archive-files.txt || grep -Fxq "system/bin/$abi/sing-box" archive-files.txt; then
              echo "unexpected binary for ABI: $abi" >&2
              exit 1
            fi
          done <<EOF
          $ABI_LIST
          EOF
