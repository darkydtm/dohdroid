name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Rust ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [fmt, test, clippy]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        if: matrix.check != 'fmt'
        with:
          workspaces: daemon
      - if: matrix.check == 'fmt'
        run: cargo fmt --manifest-path daemon/Cargo.toml --check
      - if: matrix.check == 'test'
        run: cargo test --manifest-path daemon/Cargo.toml
      - if: matrix.check == 'clippy'
        run: cargo clippy --manifest-path daemon/Cargo.toml --all-targets --all-features -- -D warnings

  scripts:
    name: Script checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n module/service.sh module/uninstall.sh module/action.sh module/customize.sh package.sh module/scripts/*.sh scripts/*.sh
      - run: node tests/webui-permission.test.js
      - run: node tests/build-info.test.js
      - run: sh tests/install-permissions.test.sh

  build:
    name: Build ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
            linker: aarch64-linux-android24-clang
            cc: aarch64-linux-android24-clang
            ar: llvm-ar
            cargo_target: AARCH64_LINUX_ANDROID
          - abi: armeabi-v7a
            target: armv7-linux-androideabi
            linker: armv7a-linux-androideabi24-clang
            cc: armv7a-linux-androideabi24-clang
            ar: llvm-ar
            cargo_target: ARMV7_LINUX_ANDROIDEABI
          - abi: x86_64
            target: x86_64-linux-android
            linker: x86_64-linux-android24-clang
            cc: x86_64-linux-android24-clang
            ar: llvm-ar
            cargo_target: X86_64_LINUX_ANDROID
          - abi: x86
            target: i686-linux-android
            linker: i686-linux-android24-clang
            cc: i686-linux-android24-clang
            ar: llvm-ar
            cargo_target: I686_LINUX_ANDROID
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemon
          key: android-${{ matrix.target }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "ndk;26.3.11579264"
      - name: Build Android module
        env:
          TARGET: ${{ matrix.target }}
          LINKER: ${{ matrix.linker }}
          CC_NAME: ${{ matrix.cc }}
          AR_NAME: ${{ matrix.ar }}
          BUILD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/26.3.11579264"
          export CARGO_TARGET_${{ matrix.cargo_target }}_LINKER="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/$LINKER"
          target_env="${TARGET//-/_}"
          export "CC_${target_env}=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/$CC_NAME"
          export "CXX_${target_env}=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/$CC_NAME++"
          export "AR_${target_env}=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/$AR_NAME"
          cargo build --manifest-path daemon/Cargo.toml --release --target "$TARGET"
          mkdir -p "module/package/config" "module/package/system/bin/${{ matrix.abi }}"
          cp module/module.prop module/service.sh module/uninstall.sh module/action.sh module/customize.sh module/package/
          cp module/config/config.toml.example module/package/config/
          cp -R module/scripts module/package/scripts
          cp -R module/webroot module/package/webroot
          sh scripts/build-info.sh module/package/webroot
          cp "daemon/target/$TARGET/release/dohd" "module/package/system/bin/${{ matrix.abi }}/dohd"
          chmod 0755 "module/package"/*.sh "module/package/system/bin/${{ matrix.abi }}/dohd"
          chmod 0755 module/package/scripts/*.sh
          (cd module/package && zip -qr "../../dohd-${{ matrix.abi }}.zip" .)
          sha256sum "dohd-${{ matrix.abi }}.zip" > "dohd-${{ matrix.abi }}.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: dohd-module-${{ matrix.abi }}
          path: |
            dohd-${{ matrix.abi }}.zip
            dohd-${{ matrix.abi }}.zip.sha256
          if-no-files-found: error

  verify-modules:
    name: Verify ${{ matrix.abi }} module
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64, x86]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dohd-module-${{ matrix.abi }}
      - name: Verify module contents
        run: |
          set -euxo pipefail
          archive="dohd-${{ matrix.abi }}.zip"
          sha256sum -c "$archive.sha256"
          unzip -l "$archive"
          unzip -Z1 "$archive" | grep -Fx 'scripts/firewall.sh'
          unzip -Z1 "$archive" | grep -Fx 'scripts/webui.sh'
          unzip -Z1 "$archive" | grep -Fx 'customize.sh'
          unzip -Z1 "$archive" | grep -Fx 'webroot/index.html'
          unzip -Z1 "$archive" | grep -Fx 'webroot/build-info.js'
          unzip -Z1 "$archive" | grep -Fx "system/bin/${{ matrix.abi }}/dohd"
          ! unzip -Z1 "$archive" | grep -E '^system/bin/(arm64-v8a|armeabi-v7a|x86_64|x86)/dohd$' | grep -vFx "system/bin/${{ matrix.abi }}/dohd"
